[project]
name = "agent-sandbox-kernel"
version = "5.0.0"
description = "Backend-first AI agent sandbox kernel for static audit, optional LLM review, and lightweight Docker execution."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "python-multipart>=0.0.9",
  "pydantic>=2.8.0",
  "httpx>=0.27.0",
  "PyYAML>=6.0.0",
  "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
]

[project.scripts]
aegisagent-eval = "agent_sandbox.evaluation:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
